<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตั้งกระทู้</title>
  <link rel="stylesheet" href="post.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="nav-bar">
    <div style="margin-left: 50px">
      <h1 onclick="goTo('home')">Polycat</h1>
    </div>
  </div>

  <div class="form-container">
    <h2>ตั้งกระทู้ใหม่</h2>
    <form id="postForm" enctype="multipart/form-data">
      <label for="postContent">เนื้อหา:</label>
      <textarea id="postContent" rows="5" required></textarea>

      <label for="category">หมวดหมู่:</label>
      <select id="category" required>
        <option value="">-- เลือกหมวดหมู่ --</option>
        <option value="การ์ตูน">การ์ตูน</option>
        <option value="กีฬา">กีฬา</option>
        <option value="สยองขวัญ">สยองขวัญ</option>
        <option value="การศึกษา">การศึกษา</option>
        <option value="หนัง">หนัง</option>
        <option value="เกม">เกม</option>
        <option value="ท่องเที่ยว">ท่องเที่ยว</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>

      <label for="image">รูปภาพ:</label>
      <input type="file" id="image" accept="image/*" multiple/>

      <button type="submit">โพสต์</button>
    </form>
  </div>
     
  <script src="js/post.js"></script>
</body>
</html>
